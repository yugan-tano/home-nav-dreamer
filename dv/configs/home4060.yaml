# DreamerV3 RTX 4060 8GB 显存配置 - 居家导航场景 HomeNav-v0
# 模型: size12m (~12M参数, deter=2048, stoch=16, classes=16)

defaults:
  logdir: /mnt/e/logdir/dreamer_home/{timestamp}
  replica: 0
  replicas: 1
  method: name
  task: gym_HomeNav-v0
  seed: 0
  script: train
  batch_size: 8
  batch_length: 32
  report_length: 16
  consec_train: 1
  consec_report: 1
  replay_context: 1
  random_agent: False
  ipv6: False
  errfile: False

  run:
    steps: 500000
    train_ratio: 64
    log_every: 60
    report_every: 120
    save_every: 300
    envs: 4
    eval_envs: 0
    debug: True
    from_checkpoint: ''
    from_checkpoint_regex: '.*'
    episode_timeout: 120

  jax:
    platform: cuda
    compute_dtype: bfloat16
    policy_devices: [0]
    train_devices: [0]
    prealloc: False
    jit: True
    debug: False

  agent:
    loss_scales:
      rec: 1.0
      rew: 1.0
      con: 1.0
      dyn: 2.0
      rep: 0.3
      policy: 1.0
      value: 1.0
      repval: 0.3
    opt:
      lr: 2e-5
      agc: 0.3
      eps: 1e-20
      beta1: 0.9
      beta2: 0.999
      momentum: True
      wd: 0.0
      schedule: const
      warmup: 1000
      anneal: 0
    dyn:
      typ: rssm
      rssm:
        deter: 2048
        hidden: 256
        stoch: 16
        classes: 16
        act: silu
        norm: rms
        unimix: 0.02
        outscale: 1.0
        winit: trunc_normal_in
        imglayers: 2
        obslayers: 1
        dynlayers: 1
        absolute: False
        blocks: 8
        free_nats: 3.0
    enc:
      typ: simple
      simple:
        depth: 16
        mults: [2, 3, 4, 4]
        layers: 3
        units: 256
        act: silu
        norm: rms
        winit: trunc_normal_in
        symlog: True
        outer: False
        kernel: 5
        strided: False
    dec:
      typ: simple
      simple:
        depth: 16
        mults: [2, 3, 4, 4]
        layers: 3
        units: 256
        act: silu
        norm: rms
        outscale: 1.0
        winit: trunc_normal_in
        outer: False
        kernel: 5
        bspace: 8
        strided: False
    rewhead:
      layers: 1
      units: 256
      act: silu
      norm: rms
      output: symexp_twohot
      outscale: 0.0
      winit: trunc_normal_in
      bins: 255
    conhead:
      layers: 1
      units: 256
      act: silu
      norm: rms
      output: binary
      outscale: 1.0
      winit: trunc_normal_in
    policy:
      layers: 3
      units: 256
      act: silu
      norm: rms
      minstd: 0.1
      maxstd: 1.0
      outscale: 0.01
      unimix: 0.01
      winit: trunc_normal_in
    value:
      layers: 3
      units: 256
      act: silu
      norm: rms
      output: symexp_twohot
      outscale: 0.0
      winit: trunc_normal_in
      bins: 255
    policy_dist_disc: categorical
    policy_dist_cont: bounded_normal
    imag_last: 0
    imag_length: 15
    horizon: 333
    contdisc: True
    imag_loss:
      slowtar: False
      lam: 0.95
      actent: 1e-4
      slowreg: 1.0
    repl_loss:
      slowtar: False
      lam: 0.95
      slowreg: 1.0
    slowvalue:
      rate: 0.02
      every: 1
    retnorm:
      impl: perc
      rate: 0.01
      limit: 1.0
      perclo: 5.0
      perchi: 95.0
      debias: False
    valnorm:
      impl: none
      rate: 0.01
      limit: 1e-8
    advnorm:
      impl: none
      rate: 0.01
      limit: 1e-8
    reward_grad: True
    repval_loss: True
    repval_grad: True
    report: True
    report_gradnorms: False

  env:
    gym:
      size: 64
      max_steps: 200
      render_mode: rgb_array
      hard_mode: False

  logger:
    outputs: [jsonl]
    filter: 'score|length|fps|ratio|train/loss/|train/rand/|reached'
    timer: True

  replay:
    size: 500000
    online: True
    fracs: {uniform: 1.0, priority: 0.0, recency: 0.0}
    chunksize: 1024

# ====== 极速测试 (CPU, 纯验证) ======
debug_home:
  batch_size: 4
  batch_length: 8
  report_length: 4
  jax: {platform: cpu, debug: True, prealloc: False}
  run:
    envs: 2
    report_every: 10
    log_every: 5
    save_every: 30
    train_ratio: 8
    debug: True
    steps: 5000
  replay.size: 5000
  agent:
    '.*\.bins': 5
    '.*\.layers': 1
    '.*\.units': 16
    '.*\.stoch': 2
    '.*\.classes': 4
    '.*\.deter': 16
    '.*\.hidden': 8
    '.*\.blocks': 4
    '.*\.depth': 2

# ====== 快速训练 (30万步, ~2-4小时, 4060可用) ======
home_quick:
  batch_size: 6
  batch_length: 32
  run:
    steps: 300000
    train_ratio: 64
    envs: 3
    log_every: 30
    report_every: 60
    save_every: 200
  replay.size: 300000
